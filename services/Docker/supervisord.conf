[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; 1) MySQL first
[program:mysql]
command=/usr/local/bin/start-mysql.sh
priority=5
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; 2) Gateway (serves React + proxies /api/*)
[program:gateway]
command=/usr/bin/gunicorn -b 0.0.0.0:8080 "gateway.app:create_app()"
directory=/app
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; 3) Birth service
[program:birth]
command=/usr/bin/gunicorn -b 0.0.0.0:5001 "birth_service.app:create_app()"
directory=/app
environment=DATABASE_URL="mysql+pymysql://birth_user:birth_pass@127.0.0.1:3306/birth_db",SECRET_KEY="dev",JWT_SECRET_KEY="devjwt"
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; 4) Vehicle service
[program:vehicle]
command=/usr/bin/gunicorn -b 0.0.0.0:5002 "vehicle_service.app:create_app()"
directory=/app
environment=DATABASE_URL="mysql+pymysql://vehicle_user:vehicle_pass@127.0.0.1:3306/vehicle_db",SECRET_KEY="dev",JWT_SECRET_KEY="devjwt"
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; 5) Housing service
[program:housing]
command=/usr/bin/gunicorn -b 0.0.0.0:5003 "housing_service.app:create_app()"
directory=/app
environment=DATABASE_URL="mysql+pymysql://housing_user:housing_pass@127.0.0.1:3306/housing_db",SECRET_KEY="dev",JWT_SECRET_KEY="devjwt"
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
